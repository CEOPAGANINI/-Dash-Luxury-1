# dash-agent v1: gerado automaticamente. Não edite: será sobrescrito.
server {
  listen 80;
  listen [::]:80;
  server_name loja-e2e.com.br www.loja-e2e.com.br;
  server_tokens off;
  include /etc/nginx/snippets/dash-agent-cabecalhos.conf;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/dash-agent-root/acme; default_type text/plain; disable_symlinks on; try_files $uri =404; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name loja-e2e.com.br www.loja-e2e.com.br;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/dash-loja-e2e/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dash-loja-e2e/privkey.pem;
  include /etc/nginx/snippets/dash-agent-tls.conf;
  root /var/www/dash-funil/loja-e2e/current;
  index index.html;
  disable_symlinks if_not_owner from=/var/www/dash-funil/loja-e2e;
  client_max_body_size 16k;
  include /etc/nginx/snippets/dash-agent-cabecalhos.conf;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/dash-agent-root/acme; default_type text/plain; disable_symlinks on; try_files $uri =404; }
  location ^~ /checkout/ { return 302 https://checkout-e2e.com.br$request_uri; }
  location ~ /\. { deny all; }
  location ~* "\.[0-9a-f]{8,}\.(?:js|css)$" { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/dash-agent-cabecalhos.conf; try_files $uri =404; }
  location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|mp3|pdf)$ { expires 1h; try_files $uri =404; }
  location / { limit_except GET HEAD { deny all; } add_header Cache-Control "no-cache"; include /etc/nginx/snippets/dash-agent-cabecalhos.conf; try_files $uri $uri/ $uri.html =404; }
  error_page 404 /404.html;
}
